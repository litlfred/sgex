# 🚨 COPILOT PROHIBITION WARNING 🚨
# 
# THIS FILE IS ABSOLUTELY CRITICAL TO GITHUB PAGES DEPLOYMENT INFRASTRUCTURE
# 
# ⛔ COPILOT AGENTS ARE STRICTLY PROHIBITED FROM MAKING ANY CHANGES TO THIS FILE
# ⛔ WITHOUT EXPLICIT WRITTEN CONSENT FROM THE REPOSITORY OWNER (@litlfred)
# 
# This workflow controls branch deployment to GitHub Pages. Any unauthorized 
# changes can break the entire deployment system for all users and branches.
# 
# 🔒 REQUIRED PROCESS FOR CHANGES:
# 1. Request explicit consent from @litlfred in a GitHub comment
# 2. Wait for written approval before making ANY changes  
# 3. Document the explicit consent in the commit message
# 4. Test extensively in a separate environment before merging
# 
# Violation of this prohibition will result in immediate reversion and 
# potential blocking of copilot access to this repository.
# 
# 🚨 END PROHIBITION WARNING 🚨

name: Deploy Feature Branch

on:
  # Manual trigger - primary way to deploy branches
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and deploy (defaults to current branch)'
        required: false
        default: ''
      force_deployment:
        description: 'Force deployment even if no changes detected'
        required: false
        type: boolean
        default: false
  # Workflow call - allows other workflows to trigger this deployment
  workflow_call:
    inputs:
      branch:
        description: 'Branch to build and deploy (defaults to current branch)'
        required: false
        type: string
        default: ''
      force_deployment:
        description: 'Force deployment even if no changes detected'
        required: false
        type: boolean
        default: false
  # Trigger for pull request events to ensure copilot and external contributions trigger workflows
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/branch-deployment.yml'

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "branch-deployment-${{ github.event.inputs.branch || github.head_ref || github.ref_name }}"
  cancel-in-progress: false

jobs:
  deploy-branch:
    if: github.base_ref != 'gh-pages'
    runs-on: ubuntu-latest
    environment: 
      name: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.branch == 'main' || github.ref_name == 'main')) && 'production-pages' || 'branch-preview' }}
    outputs:
      branch_name: ${{ steps.deployment_info.outputs.branch_name }}
      target_directory: ${{ steps.deployment_info.outputs.target_directory }}
      branch_url: ${{ steps.deployment_info.outputs.branch_url }}
      commit_sha: ${{ steps.deployment_info.outputs.commit_sha }}
      deployment_status: ${{ steps.deployment_info.outputs.deployment_status }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Log workflow event metadata
        id: log_event
        continue-on-error: true
        env:
          GITHUB_EVENT_JSON: ${{ toJSON(github.event) }}
          GITHUB_CONTEXT_JSON: ${{ toJSON(github) }}
        run: |
          echo "📋 Logging GitHub Actions event metadata..."
          echo "=================================================="
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref Name: ${{ github.ref_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "Run Attempt: ${{ github.run_attempt }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "=================================================="
          
          # Create artifacts directory
          mkdir -p artifacts
          
          # Log complete event payload and GitHub context (JSON passed via env vars to avoid bash escaping issues)
          python3 scripts/log_workflow_event.py \
            --event-name "${{ github.event_name }}" \
            --output-file "artifacts/workflow-event.log"
          
          echo "✅ Event metadata logged to artifacts/workflow-event.log"
          echo ""
          echo "🔗 GitHub Links:"
          echo "   Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          if [[ "${{ github.ref_name }}" != "" && "${{ github.ref_name }}" != "refs/pull/"* ]]; then
            echo "   Branch: https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}"
          fi
          echo "   Workflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload workflow event log (early upload)
        if: always()
        id: upload_event_log
        uses: actions/upload-artifact@v4
        with:
          name: workflow-event-log
          path: artifacts/workflow-event.log
          retention-days: 90
          if-no-files-found: warn

      - name: Get event log artifact URL
        if: always()
        id: event_artifact_url
        continue-on-error: true
        run: |
          # Retrieve artifact URL
          python3 scripts/get_artifact_urls.py \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --artifact-names "workflow-event-log" \
            --output-file "artifacts/event-artifact-url.json" \
            --max-retries 5 \
            --retry-delay 2
          
          # Extract URL for use in subsequent steps
          if [ -f "artifacts/event-artifact-url.json" ]; then
            EVENT_URL=$(python3 -c "import json; data=json.load(open('artifacts/event-artifact-url.json')); print(data.get('artifact_urls', {}).get('workflow-event-log', ''))")
            echo "event_artifact_url=$EVENT_URL" >> $GITHUB_OUTPUT
            echo "Event artifact URL: $EVENT_URL"
          fi

      - name: Find associated PR
        id: find_pr
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          result-encoding: string
          script: |
            const branchName = '${{ github.event.inputs.branch || github.head_ref || github.ref_name }}';
            try {
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${branchName}`
              });
              if (prs.length > 0) {
                console.log(`Found PR #${prs[0].number}`);
                return prs[0].number.toString();
              }
              console.log('No PR found');
              return '';
            } catch (error) {
              console.error('Error finding PR:', error);
              return '';
            }

      - name: Update PR comment - Build Started
        if: steps.find_pr.outputs.result != ''
        continue-on-error: true
        run: |
          # Calculate branch URL for PR comment
          branch_name="${{ github.event.inputs.branch || github.head_ref || github.ref_name }}"
          if [[ "$branch_name" == "main" ]]; then
            public_url="/sgex/main/"
          else
            safe_branch_name=$(echo "$branch_name" | tr '/' '-')
            public_url="/sgex/${safe_branch_name}/"
          fi
          branch_url="https://${{ github.repository_owner }}.github.io${public_url}"
          
          python3 scripts/manage-pr-comment.py \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.find_pr.outputs.result }}" \
            --action-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --workflow-name "Deploy Feature Branch" \
            --event-name "${{ github.event_name }}" \
            --stage "started" \
            --data "{\"commit_sha\":\"${{ github.sha }}\",\"branch_name\":\"$branch_name\",\"commit_url\":\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\",\"workflow_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"branch_url\":\"$branch_url\",\"event_artifact_url\":\"${{ steps.event_artifact_url.outputs.event_artifact_url }}\"}"

      - name: Determine branch information
        id: branch_info
        shell: bash
        run: |
          set -e
          
          # Determine the branch being deployed
          if [[ -n "${{ github.event.inputs.branch }}" ]]; then
            branch_name="${{ github.event.inputs.branch }}"
            echo "Using manual input branch: $branch_name"
          elif [[ -n "${{ github.head_ref }}" ]]; then
            branch_name="${{ github.head_ref }}"
            echo "Using pull request branch: $branch_name"
          else
            branch_name="${{ github.ref_name }}"
            echo "Using current branch: $branch_name"
          fi
          
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "Building and deploying branch: $branch_name"

      - name: Determine PUBLIC_URL and branch URL
        id: public_url
        run: |
          branch_name="${{ steps.branch_info.outputs.branch_name }}"
          if [[ "$branch_name" == "main" ]]; then
            public_url="/sgex/main/"
          else
            safe_branch_name=$(echo "$branch_name" | tr '/' '-')
            public_url="/sgex/${safe_branch_name}/"
          fi
          export PUBLIC_URL="$public_url"
          echo "public_url=$public_url" >> $GITHUB_OUTPUT
          echo "Determined PUBLIC_URL: $public_url"
          
          # Also calculate the full branch URL for PR comments
          branch_url="https://${{ github.repository_owner }}.github.io${public_url}"
          echo "branch_url=$branch_url" >> $GITHUB_OUTPUT
          echo "Branch URL: $branch_url"

      - name: Configure git user
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        continue-on-error: false

      - name: Update PR comment - Environment Setup Complete
        if: steps.find_pr.outputs.result != ''
        continue-on-error: true
        run: |
          python3 scripts/manage-pr-comment.py \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.find_pr.outputs.result }}" \
            --action-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --workflow-name "Deploy Feature Branch" \
            --event-name "${{ github.event_name }}" \
            --stage "setup" \
            --data "{\"commit_sha\":\"${{ github.sha }}\",\"branch_name\":\"${{ steps.branch_info.outputs.branch_name }}\",\"commit_url\":\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\",\"workflow_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"branch_url\":\"${{ steps.public_url.outputs.branch_url }}\"}"

      - name: Skip QA Generation for Branch Deployment
        run: |
          echo "ℹ️  Skipping QA report and issues analysis generation for branch deployment"
          echo "These reports are generated during main branch CI/CD and are not needed for preview deployments"
          echo "This prevents merge conflicts when multiple branches deploy simultaneously to gh-pages"


      - name: Update PR comment - Building Application
        if: steps.find_pr.outputs.result != ''
        continue-on-error: true
        run: |
          # Calculate the full branch URL based on PUBLIC_URL
          public_url="${{ steps.public_url.outputs.public_url }}"
          branch_url="https://${{ github.repository_owner }}.github.io${public_url}"
          
          python3 scripts/manage-pr-comment.py \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.find_pr.outputs.result }}" \
            --action-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --workflow-name "Deploy Feature Branch" \
            --event-name "${{ github.event_name }}" \
            --stage "building" \
            --data "{\"commit_sha\":\"${{ github.sha }}\",\"branch_name\":\"${{ steps.branch_info.outputs.branch_name }}\",\"commit_url\":\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\",\"workflow_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"branch_url\":\"$branch_url\"}"

      - name: Build branch-specific React app with enhanced logging
        id: build_app
        continue-on-error: false
        shell: bash  # Explicitly set shell to bash for PIPESTATUS support
        run: |
          echo "🔧 Starting enhanced build with comprehensive logging..."
          echo "📍 PUBLIC_URL: ${{ steps.public_url.outputs.public_url }}"
          echo "🌿 Branch: ${{ steps.branch_info.outputs.branch_name }}"
          echo ""
          
          # Create artifacts directory if not exists
          mkdir -p artifacts
          
          # Use Python script for secure build execution with comprehensive logging
          python3 scripts/build_with_logging.py \
            --public-url "${{ steps.public_url.outputs.public_url }}" \
            --branch-name "${{ steps.branch_info.outputs.branch_name }}" \
            --artifacts-dir "artifacts" 2>&1 | tee -a artifacts/build-step.log
          
          # PIPESTATUS[0] captures the exit code of the Python script (before tee)
          build_exit_code=${PIPESTATUS[0]}
          
          if [ $build_exit_code -ne 0 ]; then
            echo "❌ Build failed with exit code: $build_exit_code"
            exit $build_exit_code
          fi
          
          echo "✅ Build completed successfully"
        env:
          CI: false
          ESLINT_NO_DEV_ERRORS: true
          GENERATE_SOURCEMAP: false

      - name: Analyze build artifacts and generate bundle report
        id: analyze_bundle
        if: always()
        continue-on-error: true
        run: |
          echo "📊 Analyzing webpack bundle..."
          
          # Generate bundle analysis report
          python3 scripts/analyze_webpack_stats.py \
            --build-dir "build" \
            --output-file "artifacts/bundle-report.txt" 2>&1 | tee -a artifacts/bundle-analysis-step.log
          
          # Display summary
          if [ -f "artifacts/bundle-report.txt" ]; then
            echo "✅ Bundle analysis complete"
            echo ""
            echo "=== Bundle Summary (First 30 lines) ==="
            head -30 artifacts/bundle-report.txt
            echo ""
            echo "📦 Full report available in workflow artifacts"
          else
            echo "⚠️  Bundle analysis report not generated"
          fi

      - name: Display build artifacts summary
        if: always()
        run: |
          echo ""
          echo "=============================================================================="
          echo "📊 Build Artifacts Summary"
          echo "=============================================================================="
          echo ""
          
          if [ -f "artifacts/workflow-event.log" ]; then
            event_lines=$(wc -l < artifacts/workflow-event.log)
            event_size=$(du -h artifacts/workflow-event.log | cut -f1)
            echo "📋 Workflow Event Log: $event_lines lines, $event_size"
          else
            echo "⚠️  Workflow event log not found"
          fi
          
          if [ -f "artifacts/build-logs.txt" ]; then
            log_lines=$(wc -l < artifacts/build-logs.txt)
            log_size=$(du -h artifacts/build-logs.txt | cut -f1)
            echo "📝 Build Log: $log_lines lines, $log_size"
          else
            echo "⚠️  Build log not found"
          fi
          
          if [ -f "artifacts/webpack-stats.json" ]; then
            stats_size=$(du -h artifacts/webpack-stats.json | cut -f1)
            echo "📊 Webpack Stats: $stats_size"
          else
            echo "⚠️  Webpack stats not found"
          fi
          
          if [ -f "artifacts/bundle-report.txt" ]; then
            report_lines=$(wc -l < artifacts/bundle-report.txt)
            report_size=$(du -h artifacts/bundle-report.txt | cut -f1)
            echo "📦 Bundle Report: $report_lines lines, $report_size"
            echo ""
            echo "Top 5 Largest Files:"
            grep -A 5 "Largest Files" artifacts/bundle-report.txt | tail -5 || echo "  (Not available)"
          else
            echo "⚠️  Bundle report not found"
          fi
          
          if [ -f "artifacts/build-step.log" ]; then
            build_step_size=$(du -h artifacts/build-step.log | cut -f1)
            echo "🔧 Build Step Log: $build_step_size"
          fi
          
          if [ -f "artifacts/bundle-analysis-step.log" ]; then
            analysis_step_size=$(du -h artifacts/bundle-analysis-step.log | cut -f1)
            echo "📊 Analysis Step Log: $analysis_step_size"
          fi
          
          echo ""
          echo "=============================================================================="
          echo "🔗 Download artifacts from the Actions run page"
          echo "   Each log file is available as a separate artifact:"
          echo "   - workflow-event-log (uploaded early, available immediately)"
          echo "   - build-logs"
          echo "   - webpack-stats"
          echo "   - bundle-report"
          echo "   - build-step-log"
          echo "   - bundle-analysis-step-log"
          echo "=============================================================================="
          echo ""

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: artifacts/build-logs.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Upload webpack stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webpack-stats
          path: artifacts/webpack-stats.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: artifacts/bundle-report.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Upload build step log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-step-log
          path: artifacts/build-step.log
          retention-days: 90
          if-no-files-found: warn

      - name: Upload bundle analysis step log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis-step-log
          path: artifacts/bundle-analysis-step.log
          retention-days: 90
          if-no-files-found: warn

      - name: Get all artifact URLs
        if: always()
        id: all_artifact_urls
        continue-on-error: true
        run: |
          # Retrieve all artifact URLs
          python3 scripts/get_artifact_urls.py \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --artifact-names "workflow-event-log,build-logs,webpack-stats,bundle-report,build-step-log,bundle-analysis-step-log" \
            --output-file "artifacts/all-artifact-urls.json" \
            --max-retries 5 \
            --retry-delay 3
          
          # Extract URLs for use in subsequent steps
          if [ -f "artifacts/all-artifact-urls.json" ]; then
            cat artifacts/all-artifact-urls.json
            
            # Set outputs for each artifact
            EVENT_URL=$(python3 -c "import json; data=json.load(open('artifacts/all-artifact-urls.json')); print(data.get('artifact_urls', {}).get('workflow-event-log', ''))" 2>/dev/null || echo "")
            BUILD_LOGS_URL=$(python3 -c "import json; data=json.load(open('artifacts/all-artifact-urls.json')); print(data.get('artifact_urls', {}).get('build-logs', ''))" 2>/dev/null || echo "")
            WEBPACK_STATS_URL=$(python3 -c "import json; data=json.load(open('artifacts/all-artifact-urls.json')); print(data.get('artifact_urls', {}).get('webpack-stats', ''))" 2>/dev/null || echo "")
            BUNDLE_REPORT_URL=$(python3 -c "import json; data=json.load(open('artifacts/all-artifact-urls.json')); print(data.get('artifact_urls', {}).get('bundle-report', ''))" 2>/dev/null || echo "")
            BUILD_STEP_URL=$(python3 -c "import json; data=json.load(open('artifacts/all-artifact-urls.json')); print(data.get('artifact_urls', {}).get('build-step-log', ''))" 2>/dev/null || echo "")
            ANALYSIS_STEP_URL=$(python3 -c "import json; data=json.load(open('artifacts/all-artifact-urls.json')); print(data.get('artifact_urls', {}).get('bundle-analysis-step-log', ''))" 2>/dev/null || echo "")
            
            echo "event_artifact_url=$EVENT_URL" >> $GITHUB_OUTPUT
            echo "build_logs_url=$BUILD_LOGS_URL" >> $GITHUB_OUTPUT
            echo "webpack_stats_url=$WEBPACK_STATS_URL" >> $GITHUB_OUTPUT
            echo "bundle_report_url=$BUNDLE_REPORT_URL" >> $GITHUB_OUTPUT
            echo "build_step_url=$BUILD_STEP_URL" >> $GITHUB_OUTPUT
            echo "analysis_step_url=$ANALYSIS_STEP_URL" >> $GITHUB_OUTPUT
            
            echo "✅ Retrieved artifact URLs"
          else
            echo "⚠️  Failed to retrieve artifact URLs"
          fi

      - name: Generate Bundle Analysis Report (JSON)
        continue-on-error: true
        run: |
          echo "📊 Generating bundle analysis report..."
          
          # Generate JSON report with run ID in filename
          node scripts/generate-bundle-report-json.js bundle-report.${{ github.run_id }}.json
          
          echo "✅ Bundle report generated: bundle-report.${{ github.run_id }}.json"

      - name: Upload Bundle Analysis Report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: bundle-report-${{ github.run_id }}
          path: bundle-report.${{ github.run_id }}.json
          retention-days: 30

      - name: Validate branch directory safety
        id: validate_branch
        shell: bash
        run: |
          set -e
          
          # Get and sanitize branch name
          branch="${{ steps.branch_info.outputs.branch_name }}"
          echo "Processing branch: $branch"
          
          # Critical validation: reject empty or whitespace-only branch names
          if [[ -z "$branch" ]] || [[ "$branch" =~ ^[[:space:]]*$ ]]; then
            echo "ERROR: Branch name is empty or contains only whitespace"
            exit 1
          fi
          
          # Validate branch name (no dangerous characters)
          if [[ "$branch" =~ [^a-zA-Z0-9._/-] ]]; then
            echo "ERROR: Branch name contains unsafe characters: $branch"
            exit 1
          fi
          
          # Replace slashes with dashes for safe directory names
          safe_branch_name=$(echo "$branch" | tr '/' '-')
          echo "Safe branch name: $safe_branch_name"
          
          # Critical validation: reject problematic directory names
          if [[ -z "$safe_branch_name" ]] || [[ "$safe_branch_name" == "." ]] || [[ "$safe_branch_name" == ".." ]]; then
            echo "ERROR: Branch name resolves to unsafe directory name: '$safe_branch_name'"
            exit 1
          fi
          
          # Reject names that could conflict with git or system directories
          if [[ "$safe_branch_name" =~ ^\.(git|github)$ ]]; then
            echo "ERROR: Branch name conflicts with reserved directory: $safe_branch_name"
            exit 1
          fi
          
          # Use simplified path structure: main goes to /main/, others to /safe-branch-name/
          if [[ "$branch" == "main" ]]; then
            target_subdir="main"
          else
            target_subdir="$safe_branch_name"
          fi
          
          # Calculate target directory path
          repo_root="$(pwd)"
          target_dir="$repo_root/$target_subdir"
          
          echo "Target directory: $target_dir"
          
          # Critical safety validation
          if [[ "$target_dir" != "$repo_root"* ]]; then
            echo "ERROR: Target directory is outside repository root"
            exit 1
          fi
          
          if [[ ${#target_dir} -le ${#repo_root} ]]; then
            echo "ERROR: Target directory path is not longer than repository root"
            exit 1
          fi
          
          # Additional safety: ensure target is exactly one level deeper
          expected_path="$repo_root/$target_subdir"
          if [[ "$target_dir" != "$expected_path" ]]; then
            echo "ERROR: Target directory does not match expected path"
            exit 1
          fi
          
          # Critical safety: ensure target subdirectory doesn't resolve to root
          if [[ "$target_subdir" == "." ]] || [[ -z "$target_subdir" ]]; then
            echo "ERROR: Target subdirectory would resolve to repository root"
            echo "This would overwrite the landing page - deployment aborted"
            exit 1
          fi
          
          echo "✅ Branch directory validation passed"
          echo "branch_dir=$target_dir" >> "$GITHUB_OUTPUT"
          echo "branch_name=$branch" >> "$GITHUB_OUTPUT"
          echo "safe_branch_name=$safe_branch_name" >> "$GITHUB_OUTPUT"
          echo "target_subdir=$target_subdir" >> "$GITHUB_OUTPUT"

      - name: Checkout gh-pages branch
        shell: bash
        run: |
          set -e
          
          # Save the Python script before switching branches
          mkdir -p /tmp/sgex-scripts
          cp scripts/manage-pr-comment.py /tmp/sgex-scripts/manage-pr-comment.py
          
          # Check if gh-pages branch exists
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            echo "Checking out existing gh-pages branch"
            git stash -u -m "Stash before gh-pages checkout" || echo "Nothing to stash"
            git clean -fd -e node_modules
            git checkout gh-pages
          else
            echo "Creating new gh-pages branch"
            git checkout --orphan gh-pages
            git rm -rf .
            echo "# GitHub Pages" > README.md
            git add README.md
            git commit -m "Initial gh-pages branch"
            git push origin gh-pages
          fi

      - name: Update PR comment - Deploying to GitHub Pages
        if: steps.find_pr.outputs.result != ''
        continue-on-error: true
        run: |
          python3 /tmp/sgex-scripts/manage-pr-comment.py \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.find_pr.outputs.result }}" \
            --action-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --workflow-name "Deploy Feature Branch" \
            --event-name "${{ github.event_name }}" \
            --stage "deploying" \
            --data "{\"commit_sha\":\"${{ github.sha }}\",\"branch_name\":\"${{ steps.branch_info.outputs.branch_name }}\",\"commit_url\":\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\",\"workflow_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"branch_url\":\"${{ steps.public_url.outputs.branch_url }}\"}"

      - name: Clean old deployment for this branch
        shell: bash
        run: |
          set -e
          
          target_subdir="${{ steps.validate_branch.outputs.target_subdir }}"
          
          echo "Cleaning old deployment for: $target_subdir"
          
          # Additional safety: ensure we're only removing the specific branch directory
          if [[ "$target_subdir" == "." || "$target_subdir" == ".." || -z "$target_subdir" ]]; then
            echo "ERROR: Invalid target subdirectory: '$target_subdir'"
            exit 1
          fi
          
          # Use git to safely remove the specific branch directory only
          if [[ -d "$target_subdir" ]]; then
            echo "Removing existing deployment: $target_subdir"
            git rm -rf "$target_subdir" 2>/dev/null || echo "Directory didn't exist in git"
          else
            echo "No existing deployment to clean"
          fi

      - name: Copy new build to branch directory
        shell: bash
        run: |
          set -e
          
          target_subdir="${{ steps.validate_branch.outputs.target_subdir }}"
          
          echo "Copying new build to branch directory: $target_subdir"
          
          # Create branch directory and copy build (excluding 404.html - not needed for branch deployments)
          mkdir -p "$target_subdir"
          cp -a build/. "$target_subdir/"
          
          # Remove 404.html from branch deployment - root 404.html handles all routing
          if [[ -f "$target_subdir/404.html" ]]; then
            echo "Removing redundant 404.html from branch deployment (root 404.html handles routing)"
            rm "$target_subdir/404.html"
          fi
          
          # Ensure .nojekyll file exists in root to disable Jekyll processing for entire gh-pages
          if [[ ! -f ".nojekyll" ]]; then
            echo "Creating .nojekyll file to disable Jekyll processing"
            touch .nojekyll
          fi
          
          # Verify index.html exists
          if [[ ! -f "$target_subdir/index.html" ]]; then
            echo "ERROR: index.html not found in build output"
            exit 1
          fi
          
          echo "✅ Build copied successfully to $target_subdir"

      - name: Stage and commit changes
        shell: bash
        run: |
          set -e
          
          # Critical safety check: ensure we're on gh-pages branch
          current_branch=$(git branch --show-current)
          echo "Current branch: $current_branch"
          
          if [[ "$current_branch" != "gh-pages" ]]; then
            echo "ERROR: Not on gh-pages branch! Current branch: $current_branch"
            exit 1
          fi
          
          echo "Staging changes for commit"
          
          # Clean up any build directory and node_modules that shouldn't be in gh-pages root
          if [[ -d "build" ]]; then
            echo "Removing build directory from gh-pages..."
            rm -rf build
          fi
          
          if [[ -d "node_modules" ]]; then
            echo "Removing node_modules directory from gh-pages..."
            rm -rf node_modules
          fi
          
          # Add all changes initially
          git add -A
          
          # Check if there are changes to commit
          has_changes=false
          if git diff --cached --quiet; then
            if [[ "${{ github.event.inputs.force_deployment }}" == "true" ]]; then
              echo "No changes detected, but force deployment requested - will create empty commit"
              has_changes=true
            else
              echo "No changes to commit and force deployment not requested"
              exit 0
            fi
          else
            echo "Changes detected for commit"
            has_changes=true
          fi
          
          # Enhanced commit and push with robust git operations
          if [[ "$has_changes" == "true" ]]; then
            max_retries=3
            retry_count=0
            success=false
            
            # Function to clean git state
            clean_git_state() {
              echo "🧹 Cleaning git state..."
              # Abort any ongoing rebase or merge
              git rebase --abort 2>/dev/null || true
              git merge --abort 2>/dev/null || true
              # Reset to clean state while preserving staged changes
              git reset --mixed HEAD 2>/dev/null || true
              # Re-stage our changes
              git add -A
              echo "✅ Git state cleaned"
            }
            
            # Function to perform robust pull with rebase
            robust_pull_rebase() {
              echo "🔄 Performing robust pull with rebase..."
              
              # Fetch latest changes
              if ! git fetch origin gh-pages; then
                echo "❌ Failed to fetch from origin"
                return 1
              fi
              
              # Check if we're behind remote
              local_commit=$(git rev-parse HEAD)
              remote_commit=$(git rev-parse origin/gh-pages)
              
              if [[ "$local_commit" == "$remote_commit" ]]; then
                echo "✅ Already up to date with remote"
                return 0
              fi
              
              echo "📊 Local: $local_commit"
              echo "📊 Remote: $remote_commit"
              
              # Perform rebase with conflict handling
              if git rebase origin/gh-pages; then
                echo "✅ Rebase successful"
                return 0
              else
                echo "⚠️ Rebase conflicts detected, analyzing..."
                
                # Check for conflicts
                if git status --porcelain | grep -q "^UU\|^AA\|^DD"; then
                  echo "🔍 Found unresolved conflicts:"
                  git status --porcelain | grep "^UU\|^AA\|^DD" || true
                  
                  # For branch deployments, try to auto-resolve by accepting our version
                  # since each branch deploys to its own directory
                  echo "🔧 Attempting automatic conflict resolution..."
                  
                  # Get list of conflicted files
                  conflicted_files=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
                  
                  if [[ -n "$conflicted_files" ]]; then
                    echo "📝 Conflicted files:"
                    echo "$conflicted_files"
                    
                    # For deployment conflicts, use our version (--ours)
                    echo "🔧 Resolving conflicts by accepting our changes..."
                    git checkout --ours . 2>/dev/null || true
                    git add -A
                    
                    # Continue rebase
                    if git rebase --continue; then
                      echo "✅ Automatic conflict resolution successful"
                      return 0
                    else
                      echo "❌ Failed to continue rebase after conflict resolution"
                      git rebase --abort
                      return 1
                    fi
                  else
                    echo "❌ No conflicted files found but rebase failed"
                    git rebase --abort
                    return 1
                  fi
                else
                  echo "❌ Rebase failed but no conflicts detected"
                  git rebase --abort
                  return 1
                fi
              fi
            }
            
            # Function to perform robust push
            robust_push() {
              echo "🚀 Performing robust push..."
              
              # Try push with lease for safety
              if git push --force-with-lease origin gh-pages; then
                echo "✅ Push successful with lease protection"
                return 0
              else
                echo "⚠️ Force-with-lease push failed, trying regular push..."
                if git push origin gh-pages; then
                  echo "✅ Regular push successful"
                  return 0
                else
                  echo "❌ Push failed"
                  return 1
                fi
              fi
            }
            
            while [[ $retry_count -lt $max_retries ]] && [[ "$success" == "false" ]]; do
              retry_count=$((retry_count + 1))
              echo "🔄 Deployment attempt $retry_count of $max_retries"
              
              # Clean git state if this is a retry
              if [[ $retry_count -gt 1 ]]; then
                clean_git_state
              fi
              
              # Commit changes first
              commit_created=false
              if git diff --cached --quiet; then
                if [[ "${{ github.event.inputs.force_deployment }}" == "true" ]]; then
                  echo "Creating empty commit for force deployment"
                  git commit --allow-empty -m "🚀 Force deploy ${{ steps.branch_info.outputs.branch_name }} branch preview
                  
                  - Force deployment requested by user
                  - Deployed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')
                  - Commit: ${{ github.sha }}
                  - Attempt: $retry_count/$max_retries"
                  commit_created=true
                else
                  echo "No changes to commit after sync"
                  success=true
                  break
                fi
              else
                echo "Committing changes..."
                git commit -m "🚀 Deploy ${{ steps.branch_info.outputs.branch_name }} branch preview
                
                - Updated branch preview for ${{ steps.branch_info.outputs.branch_name }}
                - Deployed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')
                - Commit: ${{ github.sha }}
                - Attempt: $retry_count/$max_retries"
                commit_created=true
              fi
              
              # Only proceed with sync and push if we have changes to push
              if [[ "$commit_created" == "true" ]]; then
                # Perform robust pull with rebase
                if robust_pull_rebase; then
                  echo "✅ Successfully synced with remote"
                  
                  # Perform robust push
                  if robust_push; then
                    echo "✅ Push successful on attempt $retry_count"
                    success=true
                  else
                    echo "⚠️ Push failed on attempt $retry_count"
                    if [[ $retry_count -lt $max_retries ]]; then
                      # Brief delay before retry
                      sleep_time=$((retry_count * 2))
                      echo "💤 Waiting ${sleep_time} seconds before next attempt..."
                      sleep $sleep_time
                    fi
                  fi
                else
                  echo "⚠️ Failed to sync with remote on attempt $retry_count"
                  if [[ $retry_count -lt $max_retries ]]; then
                    # Brief delay before retry
                    sleep_time=$((retry_count * 2))
                    echo "💤 Waiting ${sleep_time} seconds before next attempt..."
                    sleep $sleep_time
                  fi
                fi
              fi
            done
            
            if [[ "$success" == "false" ]]; then
              echo "❌ Failed to deploy after $max_retries attempts"
              echo "This may indicate:"
              echo "  - Persistent network issues"
              echo "  - Repository access problems"
              echo "  - Concurrent deployment conflicts"
              echo "  - Git repository corruption"
              echo ""
              echo "🔍 Final git status:"
              git status --porcelain || true
              echo ""
              echo "📊 Remote status:"
              git fetch origin gh-pages 2>/dev/null || true
              git log --oneline -5 origin/gh-pages 2>/dev/null || true
              exit 1
            fi
          fi
          
          echo "✅ Deployment completed successfully"

      - name: Update PR comment - Verifying Deployment
        if: steps.find_pr.outputs.result != ''
        continue-on-error: true
        run: |
          target_subdir="${{ steps.validate_branch.outputs.target_subdir }}"
          branch_url="https://${{ github.repository_owner }}.github.io/sgex/$target_subdir/"
          python3 /tmp/sgex-scripts/manage-pr-comment.py \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.find_pr.outputs.result }}" \
            --action-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --workflow-name "Deploy Feature Branch" \
            --event-name "${{ github.event_name }}" \
            --stage "verifying" \
            --data "{\"commit_sha\":\"${{ github.sha }}\",\"branch_name\":\"${{ steps.branch_info.outputs.branch_name }}\",\"commit_url\":\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\",\"workflow_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"branch_url\":\"$branch_url\"}"

      - name: Verify deployment accessibility
        id: verify_deployment
        shell: bash
        run: |
          set -e
          
          target_subdir="${{ steps.validate_branch.outputs.target_subdir }}"
          branch_url="https://${{ github.repository_owner }}.github.io/sgex/$target_subdir/"
          max_wait_time=300  # 5 minutes maximum wait
          check_interval=15  # Check every 15 seconds
          elapsed_time=0
          
          echo "🔍 Verifying deployment accessibility at: $branch_url"
          echo "⏱️  Will check every ${check_interval}s for up to ${max_wait_time}s"
          
          while [[ $elapsed_time -lt $max_wait_time ]]; do
            echo "📡 Checking deployment accessibility (${elapsed_time}s elapsed)..."
            
            # Use curl to check if the deployment is accessible
            if curl -f -s -I "$branch_url" >/dev/null 2>&1; then
              echo "✅ Deployment is accessible at $branch_url"
              echo "⏱️  Total wait time: ${elapsed_time}s"
              echo "deployment_accessible=true" >> $GITHUB_OUTPUT
              echo "wait_time=$elapsed_time" >> $GITHUB_OUTPUT
              break
            else
              echo "⏳ Deployment not yet accessible, waiting..."
              sleep $check_interval
              elapsed_time=$((elapsed_time + check_interval))
            fi
          done
          
          # Final check
          if [[ $elapsed_time -ge $max_wait_time ]]; then
            echo "⚠️ Deployment verification timed out after ${max_wait_time}s"
            echo "🚨 GitHub Pages content server may be experiencing delays"
            echo "📝 The deployment was uploaded successfully but may take additional time to be accessible"
            echo "deployment_accessible=timeout" >> $GITHUB_OUTPUT
            echo "wait_time=$max_wait_time" >> $GITHUB_OUTPUT
          fi

      - name: Output deployment info
        id: deployment_info
        shell: bash
        run: |
          target_subdir="${{ steps.validate_branch.outputs.target_subdir }}"
          branch_name="${{ steps.branch_info.outputs.branch_name }}"
          commit_sha="${{ github.sha }}"
          branch_url="https://${{ github.repository_owner }}.github.io/sgex/$target_subdir/"
          
          echo "🎉 Branch Deployment Summary:"
          echo "- Branch: $branch_name"
          echo "- Target Directory: $target_subdir"
          echo "- Branch Preview: $branch_url"
          echo "- Commit: $commit_sha"
          echo ""
          echo "ℹ️  Note: Landing page deployment is handled separately"
          
          # GitHub Actions outputs
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "target_directory=$target_subdir" >> $GITHUB_OUTPUT
          echo "branch_url=$branch_url" >> $GITHUB_OUTPUT
          echo "commit_sha=$commit_sha" >> $GITHUB_OUTPUT
          echo "deployment_status=success" >> $GITHUB_OUTPUT

      - name: Output deployment failure info
        id: deployment_failure_info
        if: always() && failure()
        shell: bash
        run: |
          branch_name="${{ github.event.inputs.branch || github.head_ref || github.ref_name }}"
          commit_sha="${{ github.sha }}"
          
          echo "🚨 Branch Deployment Failed:"
          echo "- Branch: $branch_name"
          echo "- Commit: $commit_sha"
          echo "- Check build logs for details"
          
          # GitHub Actions outputs for failure case
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "commit_sha=$commit_sha" >> $GITHUB_OUTPUT
          echo "deployment_status=failure" >> $GITHUB_OUTPUT

      - name: Comment on associated PR (Success)
        if: always() && steps.deployment_info.outputs.deployment_status == 'success' && steps.find_pr.outputs.result != ''
        continue-on-error: true
        run: |
          target_subdir="${{ steps.validate_branch.outputs.target_subdir }}"
          branch_url="https://${{ github.repository_owner }}.github.io/sgex/$target_subdir/"
          bundle_report_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
          python3 /tmp/sgex-scripts/manage-pr-comment.py \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.find_pr.outputs.result }}" \
            --action-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --workflow-name "Deploy Feature Branch" \
            --event-name "${{ github.event_name }}" \
            --stage "success" \
            --data "{\"commit_sha\":\"${{ github.sha }}\",\"branch_name\":\"${{ steps.branch_info.outputs.branch_name }}\",\"commit_url\":\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\",\"workflow_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"branch_url\":\"$branch_url\",\"build_logs_available\":true,\"artifacts_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts\",\"event_artifact_url\":\"${{ steps.all_artifact_urls.outputs.event_artifact_url }}\",\"build_logs_url\":\"${{ steps.all_artifact_urls.outputs.build_logs_url }}\",\"webpack_stats_url\":\"${{ steps.all_artifact_urls.outputs.webpack_stats_url }}\",\"bundle_report_url\":\"${{ steps.all_artifact_urls.outputs.bundle_report_url }}\",\"build_step_url\":\"${{ steps.all_artifact_urls.outputs.build_step_url }}\",\"analysis_step_url\":\"${{ steps.all_artifact_urls.outputs.analysis_step_url }}\",\"bundle_report_file\":\"bundle-report.${{ github.run_id }}.json\"}"

      - name: Comment on associated PR (Failure)
        if: always() && failure() && steps.find_pr.outputs.result != ''
        continue-on-error: true
        run: |
          python3 /tmp/sgex-scripts/manage-pr-comment.py \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.find_pr.outputs.result }}" \
            --action-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --workflow-name "Deploy Feature Branch" \
            --event-name "${{ github.event_name }}" \
            --stage "failure" \
            --data "{\"commit_sha\":\"${{ github.sha }}\",\"branch_name\":\"${{ github.event.inputs.branch || github.head_ref || github.ref_name }}\",\"commit_url\":\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\",\"workflow_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"error_message\":\"Build or deployment failed. Check logs for details.\"}"