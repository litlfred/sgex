name: Build Analysis and Logging

# This workflow provides enhanced build logging and artifact collection
# for troubleshooting and analysis of production builds.
# 
# Features:
# - Detailed webpack build stats with file-level information
# - Verbose build logging with debug output
# - Build artifacts archived for later download
# - Analysis of largest modules and bundles
# 
# How to Use:
# 1. Go to Actions tab > Build Analysis and Logging > Run workflow
# 2. Select branch and options, then click "Run workflow"
# 3. Wait for workflow to complete
# 4. Scroll to bottom of run page and download artifacts from "Artifacts" section
# 5. Extract ZIP file to access logs and statistics
# 
# Artifacts are retained for 90 days (configurable) and can be accessed
# from the Actions tab > specific workflow run > Artifacts section.
# 
# Documentation: docs/BUILD_ANALYSIS.md
# Quick Guide: docs/DOWNLOADING_BUILD_ARTIFACTS.md

on:
  # Manual trigger for on-demand build analysis
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to analyze (defaults to main)'
        required: false
        type: string
        default: 'main'
      generate_sourcemaps:
        description: 'Generate source maps for detailed debugging'
        required: false
        type: boolean
        default: false
  
  # Workflow call - allows other workflows to trigger build analysis
  workflow_call:
    inputs:
      branch:
        description: 'Branch to analyze'
        required: false
        type: string
        default: 'main'
      generate_sourcemaps:
        description: 'Generate source maps for detailed debugging'
        required: false
        type: boolean
        default: false
  
  # Optionally trigger on pushes to main for continuous monitoring
  # push:
  #   branches: [ main ]
  #   paths:
  #     - 'src/**'
  #     - 'public/**'
  #     - 'package.json'
  #     - 'package-lock.json'

permissions:
  contents: read
  actions: write

jobs:
  build-with-stats:
    name: Build with Detailed Stats and Logs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Create artifacts directory
        run: |
          mkdir -p artifacts
          echo "📦 Creating artifacts directory for build logs and stats"
      
      - name: Install dependencies with verbose logging
        run: |
          echo "📥 Installing dependencies with verbose output..."
          npm ci --legacy-peer-deps --verbose 2>&1 | tee artifacts/npm-install.log
          echo "✅ Dependencies installed"
      
      - name: Configure build for detailed stats
        id: configure_build
        run: |
          echo "⚙️ Configuring build for detailed statistics..."
          
          # Set environment variables for verbose output
          echo "VERBOSE=true" >> $GITHUB_ENV
          
          # Configure source map generation based on input
          if [[ "${{ inputs.generate_sourcemaps }}" == "true" ]]; then
            echo "GENERATE_SOURCEMAP=true" >> $GITHUB_ENV
            echo "📊 Source maps will be generated for detailed debugging"
          else
            echo "GENERATE_SOURCEMAP=false" >> $GITHUB_ENV
            echo "ℹ️ Source maps disabled to reduce build size"
          fi
          
          # Set other build environment variables
          echo "CI=false" >> $GITHUB_ENV
          echo "ESLINT_NO_DEV_ERRORS=true" >> $GITHUB_ENV
          echo "PUBLIC_URL=/sgex/" >> $GITHUB_ENV
          
          echo "build_timestamp=$(date -u '+%Y-%m-%d_%H-%M-%S_UTC')" >> $GITHUB_OUTPUT
          echo "✅ Build configuration complete"
      
      - name: Build with webpack stats
        id: build
        run: |
          echo "🔨 Building application with detailed webpack statistics..."
          echo "Build started at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          
          # Run the build with detailed output
          npm run build -- --stats 2>&1 | tee artifacts/build.log
          
          echo "Build completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "✅ Build completed successfully"
        continue-on-error: false
      
      - name: Generate webpack bundle stats JSON
        if: success()
        run: python3 scripts/generate-webpack-stats.py || echo "⚠️ Failed to generate stats JSON (non-fatal)"
        continue-on-error: true
      
      - name: Analyze build output and largest modules
        if: success()
        run: python3 scripts/analyze-build-output.py | tee artifacts/build-analysis.txt
      
      - name: Generate build summary
        if: always()
        run: |
          python3 scripts/generate-build-readme.py \
            --branch "${{ inputs.branch || 'main' }}" \
            --commit "${{ github.sha }}" \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      
      - name: Save build metadata
        if: always()
        run: |
          python3 scripts/generate-build-metadata.py \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --branch "${{ inputs.branch || 'main' }}" \
            --commit-sha "${{ github.sha }}" \
            --commit-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            --build-timestamp "${{ steps.configure_build.outputs.build_timestamp }}" \
            --generate-sourcemaps "${{ inputs.generate_sourcemaps || false }}" \
            --node-version "20" \
            --runner-os "${{ runner.os }}" \
            --triggered-by "${{ github.actor }}" \
            --event-name "${{ github.event_name }}"
      
      - name: Upload build logs and stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-and-stats-${{ steps.configure_build.outputs.build_timestamp }}
          path: artifacts/
          retention-days: 90
          compression-level: 6
          if-no-files-found: warn
      
      - name: Create workflow summary
        if: always()
        run: |
          echo "## 📊 Build Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ inputs.branch || 'main' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Build Timestamp:** ${{ steps.configure_build.outputs.build_timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "**Source Maps:** ${{ inputs.generate_sourcemaps || false }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f artifacts/build-analysis.txt ]; then
            echo "### 📈 Build Size Analysis" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -30 artifacts/build-analysis.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Download Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build logs and statistics have been uploaded as workflow artifacts." >> $GITHUB_STEP_SUMMARY
          echo "To access them:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the [Artifacts section](#artifacts) of this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "2. Download the \`build-logs-and-stats-${{ steps.configure_build.outputs.build_timestamp }}\` artifact" >> $GITHUB_STEP_SUMMARY
          echo "3. Extract the ZIP file to view all logs and statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Retention:** Artifacts are retained for 90 days" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Build Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build Status: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the build logs artifact for detailed error information." >> $GITHUB_STEP_SUMMARY
          fi
