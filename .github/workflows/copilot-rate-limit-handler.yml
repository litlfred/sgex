name: Copilot Rate Limit Handler

on:
  # Poll for rate limit events every 5 minutes
  schedule:
    - cron: '*/5 * * * *'
  # Also trigger on PR events for immediate response
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
  # Allow manual triggering for testing
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  detect-and-handle-rate-limit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Check for Copilot rate limit error in timeline events
        id: check_rate_limit
        uses: actions/github-script@v8
        with:
          script: |
            // Determine which PRs to check
            let prsToCheck = [];
            
            if (context.eventName === 'pull_request') {
              // If triggered by PR event, check only that PR
              prsToCheck.push({
                number: context.payload.pull_request.number,
                html_url: context.payload.pull_request.html_url
              });
            } else {
              // If triggered by schedule or workflow_dispatch, check all open PRs
              const { data: openPRs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              });
              prsToCheck = openPRs.map(pr => ({ number: pr.number, html_url: pr.html_url }));
            }
            
            console.log(`Checking ${prsToCheck.length} PR(s) for Copilot rate limit events`);
            
            // Common rate limit error patterns
            const rateLimitPatterns = [
              'rate limit',
              'rate-limit',
              'too many requests',
              'retry after',
              'exceeded.*quota',
              'api rate limit exceeded',
              '429',
              'requests per'
            ];
            
            // Check each PR for rate limit events
            for (const pr of prsToCheck) {
              try {
                // Fetch timeline events for this PR
                const { data: timeline } = await github.rest.issues.listEventsForTimeline({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  per_page: 50  // Check last 50 events
                });
                
                console.log(`PR #${pr.number}: Checking ${timeline.length} timeline events`);
                
                // Look for recent Copilot error events (within last 10 minutes)
                const tenMinutesAgo = new Date(Date.now() - 10 * 60 * 1000);
                
                for (const event of timeline) {
                  const eventDate = new Date(event.created_at);
                  
                  // Skip old events
                  if (eventDate < tenMinutesAgo) continue;
                  
                  // Check if this is a Copilot-related event
                  const isCopilotEvent = 
                    (event.actor && (
                      event.actor.login.toLowerCase().includes('copilot') ||
                      event.actor.login === 'github-actions[bot]'
                    )) ||
                    (event.event === 'commented' && event.body && 
                     event.body.toLowerCase().includes('copilot'));
                  
                  if (!isCopilotEvent) continue;
                  
                  // Get event content - could be in body, message, or other fields
                  let eventContent = '';
                  if (event.body) eventContent += event.body;
                  if (event.message) eventContent += ' ' + event.message;
                  if (event.commit_message) eventContent += ' ' + event.commit_message;
                  
                  const eventContentLower = eventContent.toLowerCase();
                  
                  // Check for rate limit patterns
                  const hasRateLimitError = rateLimitPatterns.some(pattern => {
                    const regex = new RegExp(pattern, 'i');
                    return regex.test(eventContentLower);
                  });
                  
                  if (hasRateLimitError) {
                    console.log(`✓ Rate limit detected in PR #${pr.number}, event ID: ${event.id}`);
                    console.log(`  Event type: ${event.event}`);
                    console.log(`  Event date: ${event.created_at}`);
                    console.log(`  Content preview: ${eventContent.substring(0, 200)}`);
                    
                    // Try to extract wait time from event content
                    const retryAfterMatch = eventContentLower.match(/retry\s+(?:again\s+)?in\s+(\d+)\s*(minute|hour|second)/i) ||
                                           eventContentLower.match(/try\s+again\s+in\s+(\d+)\s*(minute|hour|second)/i);
                    const waitMatch = eventContentLower.match(/wait\s+(\d+)\s*(minute|hour|second)/i);
                    const timeMatch = eventContentLower.match(/(\d+)\s*(hour|minute|second)s?\s+before/i) || 
                                     eventContentLower.match(/(\d+)\s*(hour|minute|second)s?$/i);
                    
                    const match = retryAfterMatch || waitMatch || timeMatch;
                    let waitMinutes = 60; // Default to 60 minutes if not specified
                    
                    if (match) {
                      const time = parseInt(match[1]);
                      const unit = match[2].toLowerCase();
                      
                      if (unit.includes('hour')) {
                        waitMinutes = time * 60;
                      } else if (unit.includes('second')) {
                        waitMinutes = Math.ceil(time / 60);
                      } else {
                        waitMinutes = time;
                      }
                      console.log(`  Extracted wait time: ${waitMinutes} minutes`);
                    } else {
                      console.log(`  No explicit wait time found, using default: ${waitMinutes} minutes`);
                    }
                    
                    // Cap at 360 minutes (6 hours - GitHub Actions timeout)
                    waitMinutes = Math.min(waitMinutes, 360);
                    
                    core.setOutput('rate_limit_detected', 'true');
                    core.setOutput('wait_minutes', waitMinutes.toString());
                    core.setOutput('pr_number', pr.number.toString());
                    core.setOutput('pr_url', pr.html_url);
                    core.setOutput('event_id', event.id.toString());
                    
                    return {
                      detected: true,
                      waitMinutes,
                      prNumber: pr.number,
                      prUrl: pr.html_url,
                      eventId: event.id
                    };
                  }
                }
              } catch (error) {
                console.error(`Error checking PR #${pr.number}:`, error.message);
              }
            }
            
            // No rate limit detected in any PR
            console.log('✗ No rate limit events detected');
            core.setOutput('rate_limit_detected', 'false');
            return { detected: false };

      - name: Create initial notification comment
        if: steps.check_rate_limit.outputs.rate_limit_detected == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.check_rate_limit.outputs.pr_number }}
          WAIT_MINUTES: ${{ steps.check_rate_limit.outputs.wait_minutes }}
        run: |
          python scripts/manage-pr-comment.py \
            --token "$GITHUB_TOKEN" \
            --repo "${{ github.repository }}" \
            --pr "$PR_NUMBER" \
            --action-id "copilot-rate-limit-${{ github.run_id }}" \
            --workflow-name "Copilot Rate Limit Handler" \
            --event-name "${{ github.event_name }}" \
            --stage rate-limit-waiting \
            --data "{
              \"commit_sha\": \"unknown\",
              \"branch_name\": \"rate-limit-handler\",
              \"commit_url\": \"${{ steps.check_rate_limit.outputs.pr_url }}\",
              \"workflow_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"branch_url\": \"${{ steps.check_rate_limit.outputs.pr_url }}\",
              \"error_message\": \"Copilot rate limit detected. Waiting ${WAIT_MINUTES} minutes before retrying.\",
              \"remaining_minutes\": \"${WAIT_MINUTES}\"
            }"
          
          echo "Initial notification comment created"

      - name: Wait and update status every 5 minutes
        if: steps.check_rate_limit.outputs.rate_limit_detected == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.check_rate_limit.outputs.pr_number }}
          WAIT_MINUTES: ${{ steps.check_rate_limit.outputs.wait_minutes }}
        run: |
          total_wait=$((WAIT_MINUTES * 60))  # Convert to seconds
          elapsed=0
          update_interval=300  # 5 minutes in seconds
          
          echo "Starting wait for ${WAIT_MINUTES} minutes (${total_wait} seconds)"
          
          while [ $elapsed -lt $total_wait ]; do
            # Wait for update interval or remaining time, whichever is smaller
            remaining=$((total_wait - elapsed))
            wait_time=$((remaining < update_interval ? remaining : update_interval))
            
            echo "Waiting ${wait_time} seconds before next update..."
            sleep $wait_time
            
            elapsed=$((elapsed + wait_time))
            remaining_minutes=$(( (total_wait - elapsed) / 60 ))
            
            if [ $elapsed -lt $total_wait ]; then
              echo "Updating status: ${remaining_minutes} minutes remaining"
              
              python scripts/manage-pr-comment.py \
                --token "$GITHUB_TOKEN" \
                --repo "${{ github.repository }}" \
                --pr "$PR_NUMBER" \
                --action-id "copilot-rate-limit-${{ github.run_id }}" \
                --workflow-name "Copilot Rate Limit Handler" \
                --event-name "${{ github.event_name }}" \
                --stage rate-limit-waiting \
                --data "{
                  \"commit_sha\": \"unknown\",
                  \"branch_name\": \"rate-limit-handler\",
                  \"commit_url\": \"${{ steps.check_rate_limit.outputs.pr_url }}\",
                  \"workflow_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                  \"branch_url\": \"${{ steps.check_rate_limit.outputs.pr_url }}\",
                  \"error_message\": \"Yep, still here waiting. Will retry in ${remaining_minutes} minutes.\",
                  \"remaining_minutes\": \"${remaining_minutes}\"
                }"
            fi
          done
          
          echo "Wait complete!"

      - name: Update comment - Done waiting
        if: steps.check_rate_limit.outputs.rate_limit_detected == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.check_rate_limit.outputs.pr_number }}
        run: |
          python scripts/manage-pr-comment.py \
            --token "$GITHUB_TOKEN" \
            --repo "${{ github.repository }}" \
            --pr "$PR_NUMBER" \
            --action-id "copilot-rate-limit-${{ github.run_id }}" \
            --workflow-name "Copilot Rate Limit Handler" \
            --event-name "${{ github.event_name }}" \
            --stage rate-limit-complete \
            --data "{
              \"commit_sha\": \"unknown\",
              \"branch_name\": \"rate-limit-handler\",
              \"commit_url\": \"${{ steps.check_rate_limit.outputs.pr_url }}\",
              \"workflow_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"branch_url\": \"${{ steps.check_rate_limit.outputs.pr_url }}\",
              \"error_message\": \"Done waiting! Now triggering Copilot retry.\"
            }"

      - name: Post Copilot retry command
        if: steps.check_rate_limit.outputs.rate_limit_detected == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = parseInt('${{ steps.check_rate_limit.outputs.pr_number }}');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '@copilot review previous comments and try again.'
            });
            
            console.log(`Posted Copilot retry command to PR #${prNumber}`);

      - name: Handle timeout warning
        if: steps.check_rate_limit.outputs.rate_limit_detected == 'true' && steps.check_rate_limit.outputs.wait_minutes >= 360
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = parseInt('${{ steps.check_rate_limit.outputs.pr_number }}');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `⚠️ **Warning**: The wait time exceeds or is close to the GitHub Actions 6-hour timeout limit. If this workflow times out before completing, you may need to manually trigger Copilot with:\n\n\`@copilot review previous comments and try again.\`\n\nYou can also wait for the rate limit to reset naturally and then post the command yourself.`
            });
            
            console.log(`Posted timeout warning to PR #${prNumber}`);

      - name: Handle errors
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            // Try to get PR number from check_rate_limit output, or from context
            let prNumber = '${{ steps.check_rate_limit.outputs.pr_number }}';
            
            if (!prNumber && context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
            }
            
            if (prNumber) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(prNumber),
                  body: `❌ **Copilot Rate Limit Handler Error**: The automated rate limit handler encountered an error. Please check the [workflow logs](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.\n\nYou may need to manually trigger Copilot after the rate limit resets:\n\`@copilot review previous comments and try again.\``
                });
              } catch (error) {
                console.error('Failed to post error comment:', error);
              }
            } else {
              console.log('No PR number available to post error comment');
            }
